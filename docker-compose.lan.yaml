# LAN / WireGuard-reachable hub (no Tailscale).
#
# Local devices reach the hub at http://<hub-host>:8080; remote devices may reach the same
# address over an operator-managed WireGuard tunnel.
# Control who can reach it with your own firewall rules.
#
# Deploy:  docker compose -f docker-compose.lan.yaml up -d --build
services:
  hub:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASL_DATA_DIR: /data
      ASL_COPILOT_BACKEND: ${ASL_COPILOT_BACKEND:-mock}
      ASL_COPILOT_TOKEN: ${ASL_COPILOT_TOKEN:-}
      ASL_COPILOT_MODEL: ${ASL_COPILOT_MODEL:-auto}
      ASL_SCREENSHOT_TOKEN: ${ASL_SCREENSHOT_TOKEN:-}
    volumes:
      - hub-data:/data

volumes:
  hub-data:
