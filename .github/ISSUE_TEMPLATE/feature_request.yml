name: Feature request
description: Propose an improvement to the test workflow, evidence model, or supported platform.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, or compatibility considerations
      description: Note any new network, credential, log, screenshot, or API surface.
