name: Bug report
description: Report a reproducible problem in the hub, collectors, parsers, or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private databases, unredacted screenshots, or identifying logs.
        Report vulnerabilities through SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or branch name
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hub/API/UI
        - Windows collector
        - Linux collector
        - Parser/sample
        - Steam launcher
        - Deployment/container
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/client versions, and deployment mode. Redact identifying details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, private addresses, device identifiers, and personal content.
          required: true
